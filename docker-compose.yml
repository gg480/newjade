# ============================================================
# Jade ERP - 极空间 NAS Docker Compose 部署
# 使用方式：docker compose up -d
# 包含：主应用 + Watchtower 自动更新
# ============================================================

version: "3.8"

services:
  jade-erp:
    # 本地构建镜像（也可替换为仓库镜像地址）
    build:
      context: .
      dockerfile: Dockerfile
    image: ${JADE_IMAGE:-jade-erp:latest}
    container_name: jade-erp
    ports:
      - "${JADE_PORT:-5000}:5000"
    volumes:
      # SQLite 数据库持久化：容器内 /app/data/db 映射到宿主机目录（entrypoint.sh 使用 DATA_DIR=/app/data）
      - ${JADE_DB_DIR:-./db}:/app/data/db
      # Docker Socket：用于容器内执行更新操作
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DATABASE_URL=file:./db/custom.db
      - NODE_ENV=production
      - TZ=${TZ:-Asia/Shanghai}
      - PUID=${PUID:-0}
      - PGID=${PGID:-0}
      - JADE_VERSION=${JADE_VERSION:-latest}
    restart: unless-stopped
    # 健康检查：每 30s 探测一次 API 健康端点
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # 标签：Watchtower 识别此容器需要自动更新
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # ── Watchtower: 自动检测镜像更新 ──
  # 默认每 6 小时检查一次，发现新镜像自动拉取并重启容器
  # 可通过 WATCHTOWER_SCHEDULE 环境变量自定义 cron 表达式
  # 禁用：docker compose stop watchtower
  watchtower:
    image: containrrr/watchtower:latest
    container_name: jade-watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # 每 6 小时检查一次（也可用 WATCHTOWER_SCHEDULE 设置 cron）
      - WATCHTOWER_POLL_INTERVAL=${WATCHTOWER_INTERVAL:-21600}
      # 只更新带有 watchtower.enable=true 标签的容器
      - WATCHTOWER_LABEL_ENABLE=true
      # 更新后清理旧镜像
      - WATCHTOWER_CLEANUP=true
      # 滚动重启（避免服务中断）
      - WATCHTOWER_ROLLING_RESTART=true
      # 停止超时时间
      - WATCHTOWER_STOP_TIMEOUT=30s
      # 时区
      - TZ=${TZ:-Asia/Shanghai}
    restart: unless-stopped
    # 资源限制（Watchtower 很轻量）
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
