# ============================================================
# Jade ERP - 极空间 NAS Docker Compose 部署
# 使用方式：docker compose up -d
# ============================================================

version: "3.8"

services:
  jade-erp:
    # 本地构建镜像（也可替换为仓库镜像地址）
    build:
      context: .
      dockerfile: Dockerfile
    image: jade-erp:latest
    container_name: jade-erp
    ports:
      - "5000:5000"
    volumes:
      # SQLite 数据库持久化：容器内 /app/db 映射到宿主机 ./db 目录
      - ./db:/app/db
    environment:
      - DATABASE_URL=file:./db/custom.db
      - NODE_ENV=production
      - TZ=Asia/Shanghai
    restart: unless-stopped
    # 健康检查：每 30s 探测一次 API 健康端点
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
